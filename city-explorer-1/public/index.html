<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Explorer – Activités sur mesure</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0A0E1A;
  --paper: #F2F4F8;
  --mid: #E4E8F0;
  --cyan: #00C2FF;
  --cyan2: #0088CC;
  --electric: #00E5FF;
  --muted: #8A93A8;
  --border: rgba(0,194,255,0.18);
  --soft: rgba(0,194,255,0.07);
  --white: #FFFFFF;
  --red: #FF4757;
  --green: #2ECC71;
  --orange: #FF8C00;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Instrument Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* === GRID BACKGROUND === */
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(0,194,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,194,255,0.06) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.bg-blob1 {
  position: fixed; top:-200px; right:-200px; width:600px; height:600px;
  background: radial-gradient(circle, rgba(0,194,255,0.12) 0%, transparent 70%);
  z-index: 0; pointer-events: none;
}

.bg-blob2 {
  position: fixed; bottom:-150px; left:-150px; width:500px; height:500px;
  background: radial-gradient(circle, rgba(0,136,204,0.08) 0%, transparent 70%);
  z-index: 0; pointer-events: none;
}

/* === LAYOUT === */
.app {
  position: relative; z-index: 1;
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 24px 100px;
}

/* === HEADER === */
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 56px;
  animation: slideRight 0.7s cubic-bezier(0.16,1,0.3,1);
}

.header-left {}

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--ink);
  color: var(--cyan);
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 4px;
  margin-bottom: 14px;
}

.eyebrow-dot { width: 6px; height: 6px; background: var(--cyan); border-radius: 50%; animation: pulse 2s infinite; }

h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(36px, 6vw, 60px);
  font-weight: 800;
  line-height: 0.95;
  color: var(--ink);
  letter-spacing: -0.03em;
}

h1 span { color: var(--cyan2); }

.header-tagline {
  margin-top: 14px;
  color: var(--muted);
  font-size: 15px;
  font-style: italic;
  line-height: 1.5;
  max-width: 380px;
}

.header-badge {
  flex-shrink: 0;
  width: 72px; height: 72px;
  background: var(--ink);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  box-shadow: 0 8px 24px rgba(10,14,26,0.15);
}

/* === STEP NAV === */
.step-nav {
  display: flex; gap: 6px; margin-bottom: 48px;
  flex-wrap: wrap;
  animation: fadeIn 0.5s ease 0.2s both;
}

.step-dot {
  height: 4px; border-radius: 99px;
  background: var(--mid);
  flex: 1; min-width: 20px;
  transition: background 0.4s ease, box-shadow 0.4s ease;
}

.step-dot.done { background: var(--cyan2); }
.step-dot.active { background: var(--cyan); box-shadow: 0 0 8px rgba(0,194,255,0.6); }

/* === CARD === */
.card {
  background: var(--white);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 20px;
  padding: 40px 44px;
  box-shadow: 0 4px 40px rgba(10,14,26,0.06);
  animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: hidden;
}

.card::after {
  content: '';
  position: absolute; top:0; left:0; right:0; height: 3px;
  background: linear-gradient(90deg, var(--cyan2), var(--cyan));
  border-radius: 20px 20px 0 0;
}

.step-tag {
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--cyan2);
  margin-bottom: 8px;
}

.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 24px; font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.2;
}

.card-desc {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 30px;
  line-height: 1.6;
}

/* === CITY INPUT === */
.city-input-wrap {
  position: relative;
}

.city-input {
  width: 100%;
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 14px;
  padding: 20px 24px 20px 60px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  letter-spacing: -0.02em;
}

.city-input::placeholder { color: var(--mid); }
.city-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(0,194,255,0.12); }

.city-icon {
  position: absolute; left: 20px; top: 50%;
  transform: translateY(-50%);
  font-size: 24px; pointer-events: none;
}

.city-suggestions {
  margin-top: 12px;
  display: flex; flex-wrap: wrap; gap: 8px;
}

.city-sug {
  background: var(--paper);
  border: 1px solid var(--mid);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 5px;
}

.city-sug:hover { border-color: var(--cyan); color: var(--cyan2); background: var(--soft); }

/* === GROUP === */
.group-row {
  display: flex; gap: 14px; margin-bottom: 8px;
}

.group-block {
  flex: 1;
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 14px;
  padding: 18px 14px;
  text-align: center;
  transition: border-color 0.2s;
}

.group-block.has-count { border-color: var(--cyan); }
.group-block .gb-icon { font-size: 26px; margin-bottom: 6px; }
.group-block .gb-label { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

.counter { display: flex; align-items: center; justify-content: center; gap: 10px; }

.cnt-btn {
  width: 28px; height: 28px;
  background: var(--ink);
  color: var(--white);
  border: none; border-radius: 8px;
  font-size: 16px; font-weight: bold;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.1s;
  line-height: 1;
}

.cnt-btn:hover { background: var(--cyan2); }
.cnt-btn:active { transform: scale(0.92); }
.cnt-val { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--ink); min-width: 24px; text-align: center; }

.ages-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }

.ages-section {
  margin-top: 16px;
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 12px;
  padding: 16px 18px;
}

.ages-label {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 12px;
}

.ages-inputs { display: flex; flex-wrap: wrap; gap: 10px; }

.age-input-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--white);
  border: 2px solid var(--mid);
  border-radius: 10px;
  padding: 8px 14px;
  transition: border-color 0.2s;
}

.age-input-wrap:focus-within { border-color: var(--cyan); }

.age-input-label {
  font-size: 12px; color: var(--muted); white-space: nowrap;
}

.age-input {
  width: 48px;
  border: none; outline: none;
  font-family: 'Syne', sans-serif;
  font-size: 16px; font-weight: 700;
  color: var(--ink);
  background: transparent;
  text-align: center;
  -moz-appearance: textfield;
}

.age-input::-webkit-inner-spin-button,
.age-input::-webkit-outer-spin-button { -webkit-appearance: none; }

.age-input-unit { font-size: 12px; color: var(--muted); }

/* === MONTHS === */
.months-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }

.month-tile {
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 600;
  color: var(--muted);
}

.month-tile:hover { border-color: var(--cyan); color: var(--ink); }
.month-tile.active { border-color: var(--cyan2); background: rgba(0,136,204,0.07); color: var(--cyan2); }

/* === ACTIVITIES === */
.act-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }

.act-tile {
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 12px;
  padding: 14px 10px;
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: all 0.2s;
}

.act-tile:hover { border-color: var(--cyan); transform: translateY(-1px); }
.act-tile.active { border-color: var(--cyan2); background: rgba(0,136,204,0.06); }
.act-tile .at-icon { font-size: 20px; flex-shrink: 0; }
.act-tile .at-name { font-size: 12px; font-weight: 500; color: var(--ink); line-height: 1.3; }

/* === TRANSPORT === */
.transport-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 28px; }

.transport-tile {
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 12px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.transport-tile:hover { border-color: var(--cyan); }
.transport-tile.active { border-color: var(--cyan2); background: rgba(0,136,204,0.06); }
.transport-tile .tt-icon { font-size: 22px; margin-bottom: 6px; }
.transport-tile .tt-name { font-size: 12px; font-weight: 500; color: var(--ink); }

.section-mini-label {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 12px;
}

/* === RANGE === */
.range-track {
  position: relative;
  padding: 8px 0;
}

input[type=range] {
  -webkit-appearance: none;
  width: 100%; height: 4px;
  background: linear-gradient(90deg, var(--cyan2) var(--pct, 50%), var(--mid) var(--pct, 50%));
  border-radius: 99px; outline: none; cursor: pointer;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px;
  background: var(--ink);
  border-radius: 50%;
  border: 3px solid var(--cyan);
  box-shadow: 0 2px 12px rgba(0,194,255,0.35);
  cursor: pointer;
}

.range-meta { display: flex; justify-content: space-between; margin-top: 10px; }
.range-meta span { font-size: 11px; color: var(--muted); }
.range-val { text-align: center; margin-top: 14px; font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--cyan2); }

/* === ACCOMMODATION === */
.accom-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }

.accom-tile {
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 14px;
  padding: 18px 14px;
  cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  transition: all 0.2s;
}

.accom-tile:hover { border-color: var(--cyan); transform: translateY(-1px); }
.accom-tile.active { border-color: var(--cyan2); background: rgba(0,136,204,0.06); }
.accom-tile .ac-icon { font-size: 24px; }
.accom-tile .ac-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.accom-tile .ac-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* === BUDGET === */
.budget-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }

.budget-tile {
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 14px;
  padding: 20px 16px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.budget-tile:hover { border-color: var(--cyan); transform: translateY(-1px); }
.budget-tile.active { border-color: var(--cyan2); background: rgba(0,136,204,0.06); }
.budget-tile .bt-icon { font-size: 26px; margin-bottom: 8px; }
.budget-tile .bt-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--ink); }
.budget-tile .bt-range { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* === DURATION === */
.duration-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }

.dur-tile {
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 14px;
  padding: 20px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.dur-tile:hover { border-color: var(--cyan); transform: translateY(-2px); }
.dur-tile.active { border-color: var(--cyan2); background: rgba(0,136,204,0.06); box-shadow: 0 0 0 3px rgba(0,194,255,0.1); }
.dur-tile .dt-main { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; color: var(--ink); }
.dur-tile .dt-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* === NAV BUTTONS === */
.nav-row { display: flex; gap: 12px; margin-top: 32px; }

.btn-back {
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 12px;
  padding: 14px 22px;
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
}

.btn-back:hover { border-color: var(--ink); color: var(--ink); }

.btn-next {
  flex: 1;
  background: var(--ink);
  border: none;
  border-radius: 12px;
  padding: 14px 24px;
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--white);
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.05em;
  position: relative;
  overflow: hidden;
}

.btn-next::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 0%, rgba(0,194,255,0.15) 100%);
  opacity: 0; transition: opacity 0.2s;
}

.btn-next:hover { background: var(--cyan2); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,136,204,0.3); }
.btn-next:hover::after { opacity: 1; }

/* === LOADING === */
.loading-wrap {
  text-align: center;
  padding: 60px 30px;
}

.loading-city {
  font-family: 'Syne', sans-serif;
  font-size: 48px; font-weight: 800;
  color: var(--ink);
  margin-bottom: 8px;
  opacity: 0;
  animation: fadeUp 0.5s ease 0.2s forwards;
}

.loading-sub {
  color: var(--muted);
  font-size: 14px;
  font-style: italic;
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.5s ease 0.4s forwards;
}

.loader-bar {
  width: 100%; height: 3px;
  background: var(--mid);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 20px;
}

.loader-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan2), var(--cyan));
  border-radius: 99px;
  animation: loadProgress 3s ease forwards;
}

@keyframes loadProgress { from { width:0; } to { width: 100%; } }

.loading-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.loading-tag {
  background: var(--paper);
  border: 1px solid var(--mid);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px;
  color: var(--muted);
  animation: fadeIn 0.4s ease both;
}

/* === RESULTS === */
.results-wrap { animation: cardIn 0.5s ease; }

.results-header {
  margin-bottom: 36px;
}

.results-city-label {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}

.city-pill {
  background: var(--ink);
  color: var(--cyan);
  font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 6px;
}

.results-title {
  font-family: 'Syne', sans-serif;
  font-size: 32px; font-weight: 800;
  color: var(--ink);
  line-height: 1.1;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}

.results-sub { color: var(--muted); font-size: 14px; font-style: italic; }

/* === ACTIVITY CARDS === */
.activity-list { display: flex; flex-direction: column; gap: 14px; }

.act-card {
  background: var(--white);
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 16px;
  padding: 24px 28px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: start;
  box-shadow: 0 2px 16px rgba(10,14,26,0.05);
  transition: all 0.25s;
  animation: cardIn 0.4s ease both;
  position: relative;
  overflow: hidden;
}

.act-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--cyan2), var(--cyan));
  border-radius: 3px 0 0 3px;
}

.act-card:hover { transform: translateX(4px); box-shadow: 0 6px 30px rgba(10,14,26,0.1); border-color: rgba(0,194,255,0.2); }

.act-rank {
  font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.1em;
  padding-top: 2px;
  min-width: 28px;
}

.act-rank.top3 { color: var(--cyan2); }

.act-body { flex: 1; }

.act-name {
  font-family: 'Syne', sans-serif;
  font-size: 17px; font-weight: 700;
  color: var(--ink);
  margin-bottom: 4px;
  line-height: 1.2;
}

.act-desc {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 10px;
}

.act-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.act-tag {
  background: var(--paper);
  border: 1px solid var(--mid);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  color: var(--muted);
  display: flex; align-items: center; gap: 4px;
}

.act-tag.highlight { background: rgba(0,136,204,0.08); border-color: rgba(0,136,204,0.2); color: var(--cyan2); }

.act-right { text-align: right; flex-shrink: 0; }

.act-price {
  font-family: 'Syne', sans-serif;
  font-size: 14px; font-weight: 700;
  color: var(--ink);
  margin-bottom: 4px;
}

.act-duration {
  font-size: 11px;
  color: var(--muted);
}

.act-category {
  display: inline-block;
  margin-top: 8px;
  background: var(--ink);
  color: var(--white);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
}

/* === TOP 3 SPECIAL === */
.act-selected {
  border: 2px solid #0088CC !important;
  background: rgba(0,136,204,0.05) !important;
}
.act-unselected {
  opacity: 0.65;
}
.act-unselected:hover {
  opacity: 1;
}
.act-card.top {
  border-color: rgba(0,194,255,0.3);
  background: linear-gradient(135deg, #fff 0%, rgba(0,194,255,0.03) 100%);
}

.top-badge {
  position: absolute; top: 16px; right: 16px;
  font-size: 20px;
}

/* === RESTART === */
.restart-row {
  margin-top: 32px;
  display: flex; gap: 12px;
}

.btn-restart {
  flex: 1;
  background: var(--paper);
  border: 2px solid var(--mid);
  border-radius: 12px;
  padding: 14px;
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.btn-restart:hover { border-color: var(--ink); color: var(--ink); }

.disclaimer-box {
  margin-top: 20px;
  background: rgba(255,140,0,0.06);
  border: 1px solid rgba(255,140,0,0.2);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 12px;
  color: var(--orange);
  display: flex; gap: 8px; align-items: flex-start;
  line-height: 1.5;
}

/* === ANIMATIONS === */
@keyframes slideRight { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:none; } }
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes cardIn { from { opacity:0; transform:translateY(20px) scale(0.98); } to { opacity:1; transform:none; } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

@media (max-width: 540px) {
  .card { padding: 28px 22px; }
  .temp-grid { grid-template-columns: repeat(2,1fr); }
  .act-grid { grid-template-columns: repeat(2,1fr); }
  .duration-grid { grid-template-columns: repeat(2,1fr); }
  .act-card { grid-template-columns: auto 1fr; }
  .act-right { display: none; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-blob1"></div>
<div class="bg-blob2"></div>

<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="eyebrow"><span class="eyebrow-dot"></span>City Explorer</div>
      <h1>Trouvez vos<br><span>activités</span></h1>
      <p class="header-tagline">Personnalisez votre séjour en quelques questions, obtenez un top 15 d'activités sur mesure.</p>
    </div>
    <div class="header-badge">🗺️</div>
  </div>

  <div class="step-nav" id="stepNav"></div>
  <div id="appRoot"></div>

</div>

<script>
const TOTAL_STEPS = 7;

const state = {
  step: 0,
  city: '',
  adults: 2, children: 0, babies: 0,
  childrenAges: [],
  months: [],
  activities: [],
  transport: [],
  maxHours: 2,
  accommodation: [],
  budget: null,
  duration: null,
  results: null,
  selectedActivities: [],
  usedNames: [],
};

const MONTHS_SHORT = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const MONTHS_FULL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

const ACTIVITIES = [
  { id:'beach', icon:'🏖', name:'Plage' },
  { id:'pool', icon:'🏊', name:'Piscine' },
  { id:'hike', icon:'🥾', name:'Randonnée' },
  { id:'garden', icon:'🌿', name:'Jardins' },
  { id:'zoo', icon:'🦁', name:'Zoo / Safari' },
  { id:'museum', icon:'🏛', name:'Musées' },
  { id:'monument', icon:'🗼', name:'Monuments' },
  { id:'market', icon:'🛍', name:'Marchés' },
  { id:'gastro', icon:'🍽', name:'Gastronomie' },
  { id:'nightlife', icon:'🎉', name:'Nuit & bars' },
  { id:'sport', icon:'⚽', name:'Sport' },
  { id:'wellness', icon:'🧘', name:'Bien-être' },
  { id:'art', icon:'🎨', name:'Art & expos' },
  { id:'music', icon:'🎶', name:'Concerts' },
  { id:'nature', icon:'🌳', name:'Nature' },
  { id:'kids', icon:'🎡', name:'Famille / kids' },
  { id:'photo', icon:'📸', name:'Photo spots' },
  { id:'adventure', icon:'🧗', name:'Aventure' },
];

const TRANSPORT = [
  { id:'walk', icon:'🚶', name:'À pied' },
  { id:'bike', icon:'🚲', name:'Vélo' },
  { id:'metro', icon:'🚇', name:'Métro' },
  { id:'bus', icon:'🚌', name:'Bus' },
  { id:'taxi', icon:'🚕', name:'Taxi / VTC' },
  { id:'car', icon:'🚗', name:'Voiture' },
];

const ACCOMMODATION = [
  { id:'hotel', icon:'🏨', name:'Hôtel', sub:'Classique et confortable' },
  { id:'airbnb', icon:'🏡', name:'Airbnb', sub:'Logement privatif' },
  { id:'hostel', icon:'🛏', name:'Auberge', sub:'Économique, convivial' },
  { id:'camping', icon:'⛺', name:'Camping', sub:'Nature et plein air' },
  { id:'resort', icon:'🌴', name:'Resort', sub:'Tout compris' },
  { id:'boutique', icon:'🏰', name:'Boutique hôtel', sub:'Charme & authenticité' },
];

const BUDGETS = [
  { id:'low', icon:'🌱', name:'Petit budget', range:'< 50€/j' },
  { id:'mid', icon:'💼', name:'Confort', range:'50–150€/j' },
  { id:'high', icon:'✨', name:'Premium', range:'150–300€/j' },
  { id:'lux', icon:'💎', name:'Luxe', range:'> 300€/j' },
];

const DURATIONS = [
  { id:'we', main:'Week-end', sub:'2–3 jours' },
  { id:'1w', main:'1 semaine', sub:'7 jours' },
  { id:'2w', main:'2 semaines', sub:'14 jours' },
  { id:'3w', main:'3 semaines', sub:'21 jours' },
];

const CITIES_SUGGESTIONS = [
  { flag:'🗼', name:'Paris' },
  { flag:'🌊', name:'Barcelone' },
  { flag:'🏛', name:'Rome' },
  { flag:'🍜', name:'Tokyo' },
  { flag:'🌉', name:'New York' },
  { flag:'🎡', name:'Londres' },
  { flag:'🇳🇱', name:'Amsterdam' },
  { flag:'🏔', name:'Genève' },
];

function toggle(arr, val) {
  const i = arr.indexOf(val);
  if (i > -1) arr.splice(i, 1); else arr.push(val);
  return [...arr];
}

// ---- RENDER STEP NAV ----
function renderNav() {
  const nav = document.getElementById('stepNav');
  if (state.step >= TOTAL_STEPS) { nav.style.display = 'none'; return; }
  nav.style.display = 'flex';
  nav.innerHTML = Array.from({length: TOTAL_STEPS}, (_,i) => {
    const cls = i < state.step ? 'done' : i === state.step ? 'active' : '';
    return `<div class="step-dot ${cls}"></div>`;
  }).join('');
}

// ---- MAIN RENDER ----
function render() {
  renderNav();
  const root = document.getElementById('appRoot');
  switch(state.step) {
    case 0: renderCity(root); break;
    case 1: renderGroup(root); break;
    case 2: renderPeriod(root); break;
    case 3: renderActivities(root); break;
    case 4: renderTransport(root); break;
    case 5: renderBudget(root); break;
    case 6: renderDuration(root); break;
    case 7: renderLoading(root); break;
    case 8: renderResults(root); break;
  }
}

// ---- STEP 0: CITY ----
const ALL_CITIES = [
  { flag:'🗼', name:'Paris' }, { flag:'🌹', name:'Lyon' }, { flag:'🌻', name:'Marseille' },
  { flag:'🍷', name:'Bordeaux' }, { flag:'🌊', name:'Barcelone' }, { flag:'🏛', name:'Rome' },
  { flag:'🍜', name:'Tokyo' }, { flag:'🌉', name:'New York' }, { flag:'🎡', name:'Londres' },
  { flag:'🇳🇱', name:'Amsterdam' }, { flag:'🏔', name:'Genève' }, { flag:'🌸', name:'Kyoto' },
  { flag:'🇪🇸', name:'Madrid' }, { flag:'🇵🇹', name:'Lisbonne' }, { flag:'🇬🇷', name:'Athènes' },
  { flag:'🇨🇿', name:'Prague' }, { flag:'🇦🇹', name:'Vienne' }, { flag:'🇩🇪', name:'Berlin' },
  { flag:'🇯🇵', name:'Osaka' }, { flag:'🇹🇭', name:'Bangkok' }, { flag:'🇲🇦', name:'Marrakech' },
  { flag:'🇸🇬', name:'Singapour' }, { flag:'🇩🇪', name:'Munich' }, { flag:'🇨🇦', name:'Montréal' },
  { flag:'🇧🇷', name:'Rio de Janeiro' }, { flag:'🇵🇪', name:'Lima' }, { flag:'🇦🇷', name:'Buenos Aires' },
  { flag:'🇫🇷', name:'Nantes' }, { flag:'🇫🇷', name:'Toulouse' }, { flag:'🇫🇷', name:'Nice' },
  { flag:'🇫🇷', name:'Strasbourg' }, { flag:'🇫🇷', name:'Montpellier' }, { flag:'🇮🇹', name:'Milan' },
  { flag:'🇮🇹', name:'Florence' }, { flag:'🇮🇹', name:'Venise' }, { flag:'🇧🇪', name:'Bruxelles' },
];

function renderCity(root) {
  root.innerHTML = `
  <div class="card">
    <div class="step-tag">Étape 01 / 07</div>
    <div class="card-title">Quelle ville explorez-vous ?</div>
    <div class="card-desc">Tapez ou choisissez dans la liste.</div>
    <div class="city-input-wrap" style="position:relative;">
      <span class="city-icon">📍</span>
      <input class="city-input" type="text" placeholder="Ex : Paris, Tokyo..."
        value="${state.city}"
        oninput="onCityInput(this.value)"
        onkeydown="onCityKey(event)"
        id="cityIn" autocomplete="off">
      <div id="cityDropdown" style="position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid #0088CC;border-top:none;border-radius:0 0 12px 12px;max-height:220px;overflow-y:auto;z-index:100;display:none;"></div>
    </div>
    <div style="margin-top:14px;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#8A93A8;margin-bottom:10px;">Suggestions rapides</div>
      <div class="city-suggestions">
        ${ALL_CITIES.slice(0,10).map(c => `
          <div class="city-sug" onclick="selectCity('${c.name}')">${c.flag} ${c.name}</div>
        `).join('')}
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-next" onclick="nextStep()">Continuer →</button>
    </div>
  </div>`;
  setTimeout(() => { const el = document.getElementById('cityIn'); if(el) el.focus(); }, 50);
}

function onCityInput(val) {
  state.city = val;
  const dd = document.getElementById('cityDropdown');
  if (!dd) return;
  if (!val.trim()) { dd.style.display = 'none'; return; }
  const q = val.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const matches = ALL_CITIES.filter(c =>
    c.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)
  ).slice(0, 8);
  if (matches.length === 0) { dd.style.display = 'none'; return; }
  dd.style.display = 'block';
  dd.innerHTML = matches.map(c => `
    <div onclick="selectCity('${c.name}')" style="padding:10px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;border-bottom:1px solid #F2F4F8;"
      onmouseover="this.style.background='#F2F4F8'" onmouseout="this.style.background=''">
      ${c.flag} ${c.name}
    </div>
  `).join('');
}

function onCityKey(e) {
  if (e.key === 'Enter') { document.getElementById('cityDropdown').style.display='none'; nextStep(); }
  if (e.key === 'Escape') { document.getElementById('cityDropdown').style.display='none'; }
}

function selectCity(name) {
  state.city = name;
  const dd = document.getElementById('cityDropdown');
  if (dd) dd.style.display = 'none';
  render();
}

// ---- STEP 1: GROUP ----
function renderGroup(root) {
  root.innerHTML = `
  <div class="card">
    <div class="step-tag">Étape 02 / 07</div>
    <div class="card-title">Qui sont les voyageurs ?</div>
    <div class="card-desc">Indiquez la composition de votre groupe.</div>
    <div class="group-row">
      <div class="group-block ${state.adults>0?'has-count':''}">
        <div class="gb-icon">🧑</div>
        <div class="gb-label">Adultes</div>
        <div class="counter">
          <button class="cnt-btn" onclick="chg('adults',-1)">−</button>
          <span class="cnt-val">${state.adults}</span>
          <button class="cnt-btn" onclick="chg('adults',1)">+</button>
        </div>
      </div>
      <div class="group-block ${state.children>0?'has-count':''}">
        <div class="gb-icon">🧒</div>
        <div class="gb-label">Enfants</div>
        <div class="counter">
          <button class="cnt-btn" onclick="chg('children',-1)">−</button>
          <span class="cnt-val">${state.children}</span>
          <button class="cnt-btn" onclick="chg('children',1)">+</button>
        </div>
      </div>
      <div class="group-block ${state.babies>0?'has-count':''}">
        <div class="gb-icon">👶</div>
        <div class="gb-label">Bébés</div>
        <div class="counter">
          <button class="cnt-btn" onclick="chg('babies',-1)">−</button>
          <span class="cnt-val">${state.babies}</span>
          <button class="cnt-btn" onclick="chg('babies',1)">+</button>
        </div>
      </div>
    </div>
    ${state.children > 0 ? `
    <div class="ages-section">
      <div class="ages-label">Âge des enfants</div>
      <div class="ages-inputs">
        ${Array.from({length:state.children},(_,i) => `
          <div class="age-input-wrap">
            <span class="age-input-label">Enfant ${i+1}</span>
            <input class="age-input" type="number" min="1" max="17" placeholder="âge"
              value="${state.childrenAges[i] || ''}"
              oninput="setAge(${i}, this.value)">
            <span class="age-input-unit">ans</span>
          </div>`).join('')}
      </div>
    </div>` : ''}
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">← Retour</button>
      <button class="btn-next" onclick="nextStep()">Continuer →</button>
    </div>
  </div>`;
}

function chg(k, d) {
  state[k] = Math.max(k === 'adults' ? 1 : 0, (state[k]||0) + d);
  if (k==='children' && state[k] < state.childrenAges.length) state.childrenAges.length = state[k];
  render();
}

function setAge(i, v) {
  if (v && !isNaN(v) && parseInt(v) > 0) state.childrenAges[i] = parseInt(v);
}

// ---- STEP 2: PERIOD ----
function renderPeriod(root) {
  root.innerHTML = `
  <div class="card">
    <div class="step-tag">Étape 03 / 07</div>
    <div class="card-title">Quand voyagez-vous ?</div>
    <div class="card-desc">Sélectionnez le ou les mois de votre séjour.</div>
    <div class="months-grid">
      ${MONTHS_SHORT.map((m,i) => `
        <div class="month-tile ${state.months.includes(i)?'active':''}" onclick="toggleMonth(${i})">${m}</div>
      `).join('')}
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">← Retour</button>
      <button class="btn-next" onclick="nextStep()">Continuer →</button>
    </div>
  </div>`;
}

function toggleMonth(i) { state.months = toggle(state.months, i); render(); }

// ---- STEP 4: ACTIVITIES ----
function renderActivities(root) {
  root.innerHTML = `
  <div class="card">
    <div class="step-tag">Étape 04 / 07</div>
    <div class="card-title">Quelles activités vous attirent ?</div>
    <div class="card-desc">Cochez tout ce qui vous intéresse pour affiner les suggestions.</div>
    <div class="act-grid">
      ${ACTIVITIES.map(a => `
        <div class="act-tile ${state.activities.includes(a.id)?'active':''}" onclick="toggleAct('${a.id}')">
          <span class="at-icon">${a.icon}</span>
          <span class="at-name">${a.name}</span>
        </div>`).join('')}
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">← Retour</button>
      <button class="btn-next" onclick="nextStep()">Continuer →</button>
    </div>
  </div>`;
}

function toggleAct(id) { state.activities = toggle(state.activities, id); render(); }

// ---- STEP 5: TRANSPORT ----
function renderTransport(root) {
  const h = state.maxHours;
  const pct = ((h-1)/11*100).toFixed(0);
  root.innerHTML = `
  <div class="card">
    <div class="step-tag">Étape 05 / 07</div>
    <div class="card-title">Comment vous déplacez-vous ?</div>
    <div class="card-desc">Transport dans la ville et temps de trajet maximum depuis votre hébergement.</div>
    <div class="section-mini-label">Mode(s) de transport</div>
    <div class="transport-grid">
      ${TRANSPORT.map(t => `
        <div class="transport-tile ${state.transport.includes(t.id)?'active':''}" onclick="toggleTrans('${t.id}')">
          <div class="tt-icon">${t.icon}</div>
          <div class="tt-name">${t.name}</div>
        </div>`).join('')}
    </div>
    <div class="section-mini-label">Temps de trajet maximum</div>
    <div class="range-track">
      <input type="range" min="1" max="12" value="${h}"
        style="--pct:${pct}%"
        oninput="setHours(this.value, this)">
      <div class="range-meta"><span>1h</span><span>6h</span><span>12h</span></div>
      <div class="range-val" id="hoursVal">${h}h depuis l'hébergement</div>
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">← Retour</button>
      <button class="btn-next" onclick="nextStep()">Continuer →</button>
    </div>
  </div>`;
}

function toggleTrans(id) { state.transport = toggle(state.transport, id); render(); }
function setHours(v, el) {
  state.maxHours = parseInt(v);
  const pct = ((v-1)/11*100).toFixed(0)+'%';
  el.style.setProperty('--pct', pct);
  document.getElementById('hoursVal').textContent = v + 'h depuis l\'hébergement';
}

// ---- STEP 6: ACCOMMODATION ----
function renderAccom(root) {
  root.innerHTML = `
  <div class="card">
    <div class="step-tag">Étape 06 / 08</div>
    <div class="card-title">Où logez-vous ?</div>
    <div class="card-desc">Votre type d'hébergement préféré — cela peut influencer les activités à proximité.</div>
    <div class="accom-grid">
      ${ACCOMMODATION.map(a => `
        <div class="accom-tile ${state.accommodation.includes(a.id)?'active':''}" onclick="toggleAccom('${a.id}')">
          <div class="ac-icon">${a.icon}</div>
          <div>
            <div class="ac-name">${a.name}</div>
            <div class="ac-sub">${a.sub}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">← Retour</button>
      <button class="btn-next" onclick="nextStep()">Continuer →</button>
    </div>
  </div>`;
}

function toggleAccom(id) { state.accommodation = toggle(state.accommodation, id); render(); }

// ---- STEP 7: BUDGET ----
function renderBudget(root) {
  root.innerHTML = `
  <div class="card">
    <div class="step-tag">Étape 06 / 07</div>
    <div class="card-title">Quel est votre budget activités ?</div>
    <div class="card-desc">Budget par personne et par jour pour les sorties et loisirs.</div>
    <div class="budget-grid">
      ${BUDGETS.map(b => `
        <div class="budget-tile ${state.budget===b.id?'active':''}" onclick="state.budget='${b.id}';render()">
          <div class="bt-icon">${b.icon}</div>
          <div class="bt-name">${b.name}</div>
          <div class="bt-range">${b.range}</div>
        </div>`).join('')}
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">← Retour</button>
      <button class="btn-next" onclick="nextStep()">Continuer →</button>
    </div>
  </div>`;
}

// ---- STEP 8: DURATION ----
function renderDuration(root) {
  root.innerHTML = `
  <div class="card">
    <div class="step-tag">Étape 07 / 07</div>
    <div class="card-title">Combien de temps restez-vous ?</div>
    <div class="card-desc">La durée de votre séjour pour calibrer le nombre d'activités.</div>
    <div class="duration-grid">
      ${DURATIONS.map(d => `
        <div class="dur-tile ${state.duration===d.id?'active':''}" onclick="state.duration='${d.id}';render()">
          <div class="dt-main">${d.main}</div>
          <div class="dt-sub">${d.sub}</div>
        </div>`).join('')}
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">← Retour</button>
      <button class="btn-next" onclick="generateResults()">🔍 Trouver mes activités</button>
    </div>
  </div>`;
}

// ---- STEP 9: LOADING ----
function renderLoading(root) {
  const tags = [
    'Recherche web en cours...', 'Analyse de vos critères...', 'Vérification des lieux...','Calcul des distances...','Tri par pertinence...','Finalisation du top 15...'
  ];
  root.innerHTML = `
  <div class="card loading-wrap">
    <div class="loading-city">${state.city || 'Votre ville'}</div>
    <div class="loading-sub">Personnalisation de votre programme de visites...</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <div class="loading-tags">
      ${tags.map((t,i) => `<span class="loading-tag" style="animation-delay:${i*0.3}s">${t}</span>`).join('')}
    </div>
  </div>`;
}

// ---- MOTEUR DE GÉNÉRATION IA + WEB ----

function buildPrompt() {
  var city = state.city.trim() || 'Paris';
  var groupDesc = state.adults + ' adulte(s)';
  if (state.children > 0) {
    groupDesc += ', ' + state.children + ' enfant(s)';
    var ages = state.childrenAges.filter(function(a){ return a; });
    if (ages.length > 0) groupDesc += ' (' + ages.join(', ') + ' ans)';
  }
  if (state.babies > 0) groupDesc += ', ' + state.babies + ' bébé(s)';

  var MONTHS_FULL_L = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var monthNames = state.months.map(function(m){ return MONTHS_FULL_L[m]; }).join(', ') || 'non précisée';

  var ACT_LABELS = {
    beach:'Plage',pool:'Piscine/aquatique',hike:'Randonnée',garden:'Jardins/parcs',
    zoo:'Zoo/animaux',museum:'Musées',monument:'Monuments/patrimoine',market:'Marchés',
    gastro:'Gastronomie',nightlife:'Nuit & bars',sport:'Sport',wellness:'Bien-être/spa',
    art:'Art & expositions',music:'Concerts/musique',nature:'Nature',
    kids:'Activités enfants',photo:'Photo spots',adventure:'Aventure/outdoor'
  };
  var actLabels = state.activities.map(function(id){ return ACT_LABELS[id]||id; }).join(', ') || 'tout type';

  var TRANS_LABELS = {walk:'à pied',bike:'vélo',metro:'métro/tram',bus:'bus',taxi:'taxi/VTC',car:'voiture'};
  var transLabels = state.transport.map(function(id){ return TRANS_LABELS[id]||id; }).join(', ') || 'tout moyen';

  var BUD_LABELS = {low:'petit budget (<50€/j/pers)',mid:'budget confort (50-150€/j/pers)',high:'budget premium (150-300€/j/pers)',lux:'luxe (>300€/j/pers)'};
  var budLabel = BUD_LABELS[state.budget] || 'budget non précisé';

  var DUR_LABELS = {we:'week-end (2-3 jours)','1w':'1 semaine','2w':'2 semaines','3w':'3 semaines'};
  var durLabel = DUR_LABELS[state.duration] || 'durée non précisée';

  var maxH = state.maxHours || 2;

  return 'Propose exactement 15 activités/sorties réelles et concrètes à faire à ' + city + ' ou dans un rayon de ' + maxH + 'h de trajet autour de ' + city + '.\n\n' +
    'GROUPE : ' + groupDesc + '\n' +
    'PÉRIODE : ' + monthNames + '\n' +
    'INTÉRÊTS SÉLECTIONNÉS : ' + actLabels + '\n' +
    'TRANSPORT DISPONIBLE : ' + transLabels + ' (rayon max ' + maxH + 'h)\n' +
    'BUDGET : ' + budLabel + '\n' +
    'DURÉE DU SÉJOUR : ' + durLabel + '\n\n' +
    'RÈGLES IMPÉRATIVES :\n' +
    '- Priorise ABSOLUMENT les catégories sélectionnées dans "intérêts"\n' +
    '- Respecte le rayon de ' + maxH + 'h autour de ' + city + ' (ex: si 2h, inclure les sites dans un rayon de ~150km)\n' +
    '- Adapte chaque activité à la composition du groupe (âge des enfants, bébés, etc.)\n' +
    '- Respecte le budget indiqué (évite les activités trop chères si petit budget)\n' +
    '- Inclus des lieux hors des sentiers battus, pas seulement les classiques touristiques\n' +
    '- Assure-toi que chaque lieu existe vraiment et est accessible au public\n\n' +
    'Pour chaque activité, réponds avec ce format EXACT (6 lignes + ligne vide) :\n' +
    'NOM: [nom précis du lieu ou de l\'activité]\n' +
    'CAT: [catégorie parmi : Monument, Musée, Nature, Gastronomie, Art, Marché, Quartier, Aventure, Bien-être, Zoo, Sport, Spectacle]\n' +
    'DESC: [description détaillée de 3-4 phrases : ce qu\'on y fait, pourquoi c\'est remarquable, ce qu\'on y voit/mange/vit, ambiance]\n' +
    'PRIX: [tarif précis adulte et enfant si différent]\n' +
    'DUREE: [durée recommandée]\n' +
    'TIP: [conseil pratique très concret : meilleur moment, réservation, accès, astuce locale]\n';
}

function parseActivities(text) {
  var items = [];
  var blocks = text.trim().split(/\n\s*\n/);
  for (var bi = 0; bi < blocks.length; bi++) {
    if (items.length >= 15) break;
    var block = blocks[bi].trim();
    if (!block) continue;
    var lines = block.split('\n');
    var get = function(prefix) {
      for (var li = 0; li < lines.length; li++) {
        if (lines[li].toUpperCase().indexOf(prefix) === 0) {
          return lines[li].replace(/^[^:]+:\s*/i, '').trim();
        }
      }
      return '';
    };
    var name = get('NOM');
    if (!name || name.charAt(0) === '[') continue;
    items.push({
      rank: items.length + 1,
      name: name,
      category: get('CAT') || 'Activité',
      description: get('DESC') || '',
      price: get('PRIX') || 'Consulter sur place',
      duration: get('DUREE') || '',
      tags: [get('CAT') || 'Activité'],
      tip: get('TIP') || ''
    });
  }
  return items;
}

async function generateResults() {
  var city = state.city.trim() || 'Paris';
  state.step = 7;
  state.selectedActivities = [];
  state.usedNames = [];
  render();

  var userPrompt = buildPrompt();

  try {
    var res = await fetch('/api/claude', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 6000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        system: 'Tu es un expert local de voyage et guide touristique. Tu utilises la recherche web pour fournir des informations précises, actuelles et vérifiées. Réponds UNIQUEMENT dans le format demandé, sans introduction ni conclusion, directement avec les blocs d\'activités.',
        messages: [{ role: 'user', content: userPrompt }]
      })
    });

    var data = await res.json();
    if (data.error) throw new Error(data.error.message);

    var text = (data.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('');
    if (!text) throw new Error('Réponse vide de l\'API');

    var activities = parseActivities(text);
    if (activities.length === 0) throw new Error('Aucune activité dans la réponse — format inattendu.');

    // Mémoriser les noms affichés
    state.usedNames = activities.map(function(a){ return a.name; });

    state.results = {
      city: city,
      activities: activities
    };
    state.step = 8;
    render();

  } catch(e) {
    state.results = { city: city, activities: [], error: true, errorMsg: e.message };
    state.step = 8;
    render();
  }
}

async function refreshUnselected() {
  var d = state.results;
  var city = d.city;

  // Activités gardées
  var keptActivities = [];
  for (var ki = 0; ki < state.selectedActivities.length; ki++) {
    var idx = state.selectedActivities[ki];
    if (d.activities[idx]) keptActivities.push(d.activities[idx]);
  }

  var nbReplace = d.activities.length - keptActivities.length;
  if (nbReplace === 0) {
    alert('Sélectionnez au moins une activité à remplacer (décochez-en quelques-unes).');
    return;
  }

  // Afficher un mini-loading
  var btn = document.getElementById('refreshBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Recherche en cours...'; }

  // Noms déjà vus
  if (!state.usedNames) state.usedNames = [];
  for (var ui = 0; ui < d.activities.length; ui++) {
    if (state.usedNames.indexOf(d.activities[ui].name) === -1) {
      state.usedNames.push(d.activities[ui].name);
    }
  }

  var keptNames = keptActivities.map(function(a){ return a.name; }).join(', ');
  var MONTHS_FULL_L = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var monthNames = state.months.map(function(m){ return MONTHS_FULL_L[m]; }).join(', ') || 'flexible';
  var maxH = state.maxHours || 2;
  var ACT_LABELS = {beach:'Plage',pool:'Piscine/aquatique',hike:'Randonnée',garden:'Jardins/parcs',zoo:'Zoo/animaux',museum:'Musées',monument:'Monuments/patrimoine',market:'Marchés',gastro:'Gastronomie',nightlife:'Nuit & bars',sport:'Sport',wellness:'Bien-être/spa',art:'Art & expositions',music:'Concerts/musique',nature:'Nature',kids:'Activités enfants',photo:'Photo spots',adventure:'Aventure/outdoor'};
  var actLabels = state.activities.map(function(id){ return ACT_LABELS[id]||id; }).join(', ') || 'tout type';

  var replacePrompt = 'Propose exactement ' + nbReplace + ' nouvelles activités à ' + city + ' ou dans un rayon de ' + maxH + 'h.\n' +
    'ACTIVITÉS DÉJÀ CHOISIES (ne pas répéter) : ' + state.usedNames.join(', ') + '\n' +
    'Intérêts : ' + actLabels + '\n' +
    'Période : ' + monthNames + '\n' +
    'Transport : rayon ' + maxH + 'h autour de ' + city + '\n\n' +
    'Propose ' + nbReplace + ' activités DIFFÉRENTES, jamais citées ci-dessus.\n\n' +
    'Format exact pour chaque activité (6 lignes + ligne vide) :\n' +
    'NOM: [nom]\nCAT: [catégorie]\nDESC: [description 3-4 phrases]\nPRIX: [prix]\nDUREE: [durée]\nTIP: [conseil]\n';

  try {
    var res = await fetch('/api/claude', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        system: 'Tu es un expert local de voyage. Réponds UNIQUEMENT dans le format demandé, directement avec les blocs d\'activités.',
        messages: [{ role: 'user', content: replacePrompt }]
      })
    });

    var data = await res.json();
    if (data.error) throw new Error(data.error.message);
    var text = (data.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('');
    var newOnes = parseActivities(text);

    if (newOnes.length === 0) throw new Error('Aucune activité de remplacement trouvée.');

    // Ajouter les nouveaux noms aux usedNames
    for (var ni = 0; ni < newOnes.length; ni++) {
      state.usedNames.push(newOnes[ni].name);
    }

    // Construire la nouvelle liste
    var newActivities = [];
    for (var ki2 = 0; ki2 < keptActivities.length; ki2++) {
      newActivities.push(Object.assign({}, keptActivities[ki2], {rank: ki2+1}));
    }
    for (var ri = 0; ri < newOnes.length; ri++) {
      newActivities.push(Object.assign({}, newOnes[ri], {rank: keptActivities.length+ri+1}));
    }

    state.results.activities = newActivities;
    state.selectedActivities = [];
    for (var si = 0; si < keptActivities.length; si++) {
      state.selectedActivities.push(si);
    }
    renderResults(document.getElementById('appRoot'));

  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Remplacer les non-sélectionnées'; }
    alert('Erreur lors du remplacement : ' + e.message);
  }
}


// ---- RESULTS ----
function renderResults(root) {
  const d = state.results;
  if (!d) return;
  const topBadge = ['🥇','🥈','🥉'];

  if (d.error || !d.activities || d.activities.length === 0) {
    root.innerHTML = '<div class="card" style="text-align:center;padding:48px 40px;"><div style="font-size:48px;margin-bottom:16px;">⚠️</div><div class="card-title" style="margin-bottom:10px;">Problème</div><div class="nav-row" style="margin-top:28px;"><button class="btn-back" onclick="state.step=7;render()">← Retour</button><button class="btn-next" onclick="generateResults()">🔄 Réessayer</button></div></div>';
    return;
  }

  const sel = state.selectedActivities;
  const nbSel = sel.length;
  const selMsg = nbSel === 0
    ? 'Cliquez sur les activités que vous voulez garder ✓'
    : nbSel + ' sélectionnée(s) · les autres seront remplacées';

  let html = '<div class="results-wrap">';
  html += '<div class="results-header">';
  html += '<div class="results-city-label"><span class="city-pill">📍 ' + d.city + '</span></div>';
  html += '<div class="results-title">Top ' + d.activities.length + ' activités<br>sur mesure</div>';
  html += '<div class="results-sub" style="margin-bottom:6px;">Sélectionnez celles qui vous intéressent</div>';
  html += '<div style="font-size:12px;color:#0088CC;font-weight:600;">' + selMsg + '</div>';
  html += '</div>';
  html += '<div class="activity-list" id="actList">';

  d.activities.forEach(function(a, i) {
    var isSelected = sel.indexOf(i) > -1;
    var cardCls = 'act-card' + (i < 3 ? ' top' : '') + (isSelected ? ' act-selected' : ' act-unselected');
    var badge = isSelected
      ? '<div style="position:absolute;top:12px;right:12px;font-size:22px;z-index:2;">✅</div>'
      : (i < 3 ? '<div class="top-badge">' + topBadge[i] + '</div>' : '');
    var familyFit = getFamilyFit(a);

    html += '<div class="' + cardCls + '" style="animation-delay:' + (i*0.05) + 's;cursor:pointer;transition:all 0.2s;display:block;padding:0;" onclick="toggleActivitySelection(' + i + ')">';
    html += badge;

    // Header ligne : rang + nom + catégorie + prix
    html += '<div style="display:flex;align-items:flex-start;gap:10px;padding:18px 20px 10px 20px;">';
    html += '<div class="act-rank ' + (i < 3 ? 'top3' : '') + '" style="min-width:28px;">#' + a.rank + '</div>';
    html += '<div style="flex:1;">';
    html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">';
    html += '<div class="act-name" style="font-size:15px;font-weight:700;">' + a.name + '</div>';
    html += '<div class="act-category" style="flex-shrink:0;">' + a.category + '</div>';
    html += '</div>';
    html += '</div>';
    html += '<div style="text-align:right;flex-shrink:0;padding-right:' + (isSelected ? '30px' : '4px') + ';">';
    html += '<div class="act-price">' + (a.price||'Variable') + '</div>';
    html += '<div class="act-duration">⏱ ' + (a.duration||'–') + '</div>';
    html += '</div>';
    html += '</div>';

    // Description complète
    html += '<div style="padding:0 20px 10px 58px;">';
    html += '<div style="color:#4A5568;font-size:13px;line-height:1.6;margin-bottom:10px;">' + a.description + '</div>';

    // Famille adaptée
    html += '<div style="background:rgba(0,136,204,0.06);border-left:3px solid #0088CC;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12px;color:#0A0E1A;line-height:1.5;margin-bottom:10px;">';
    html += familyFit;
    html += '</div>';

    // Conseil pratique
    if (a.tip) {
      html += '<div style="background:#FFFBEB;border-left:3px solid #F59E0B;border-radius:0 8px 8px 0;padding:7px 12px;font-size:12px;color:#92400E;line-height:1.5;">';
      html += '💡 ' + a.tip;
      html += '</div>';
    }
    html += '</div>';

    html += '</div>';
  });

  html += '</div>';
  html += '<div style="margin-top:20px;background:rgba(0,136,204,0.06);border:2px dashed rgba(0,136,204,0.3);border-radius:14px;padding:18px 20px;text-align:center;">';
  html += '<div style="font-size:13px;color:#0A0E1A;font-weight:700;margin-bottom:4px;">Pas satisfait de certaines activités ?</div>';
  html += '<div style="font-size:12px;color:#8A93A8;margin-bottom:14px;">Sélectionnez celles que vous gardez · les autres seront remplacées par de nouvelles.</div>';
  html += '<button id="refreshBtn" onclick="refreshUnselected()" style="background:#0A0E1A;border:none;border-radius:12px;padding:13px 24px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;">🔄 Remplacer les non-sélectionnées</button>';
  html += '</div>';
  html += '<div class="restart-row">';
  html += '<button class="btn-restart" onclick="restartApp()">↺ Nouvelle recherche</button>';
  html += '<button class="btn-restart" onclick="changeCity()">📍 Changer de ville</button>';
  html += '</div>';
  html += '<div class="disclaimer-box">ℹ️ Les prix et horaires sont indicatifs. Vérifiez les informations sur les sites officiels avant votre visite.</div>';
  html += '</div>';

  root.innerHTML = html;
}

function toggleActivitySelection(i) {
  const idx = state.selectedActivities.indexOf(i);
  if (idx > -1) state.selectedActivities.splice(idx, 1);
  else state.selectedActivities.push(i);
  renderResults(document.getElementById('appRoot'));
}

function getFamilyFit(a) {
  var parts = [];
  var hasBabies = state.babies > 0;
  var hasKids = state.children > 0;
  var adults = state.adults;
  var cat = (a.category || '').toLowerCase();
  var name = (a.name || '').toLowerCase();
  var price = (a.price || '').toLowerCase();

  // Adapté bébés
  if (hasBabies) {
    if (cat === 'nature' || cat === 'quartier' || name.indexOf('parc') > -1 || name.indexOf('jardin') > -1) {
      parts.push('accessible avec une poussette');
    } else if (cat === 'musée' || cat === 'monument') {
      parts.push('prévoir une durée courte pour les bébés');
    }
  }

  // Adapté enfants
  if (hasKids) {
    var ages = state.childrenAges.filter(function(a){ return a; }).map(Number);
    var maxAge = ages.length > 0 ? Math.max.apply(null, ages) : 8;
    var minAge = ages.length > 0 ? Math.min.apply(null, ages) : 5;

    if (cat === 'nature' || name.indexOf('zoo') > -1 || name.indexOf('parc') > -1) {
      parts.push('les enfants adorent les espaces verts et les animaux');
    } else if (name.indexOf('croisière') > -1 || name.indexOf('bateau') > -1) {
      parts.push('les enfants apprécient la balade en bateau');
    } else if (cat === 'musée') {
      if (minAge >= 8) parts.push('adapté aux enfants à partir de 8 ans');
      else parts.push('choisir les salles interactives pour les plus jeunes');
    } else if (cat === 'monument') {
      if (maxAge >= 6) parts.push('les grands monuments marquent les esprits des enfants');
    } else if (cat === 'gastronomie' || cat === 'marché') {
      parts.push('découverte des saveurs locales en famille');
    }
  }

  // Budget
  var budgetMap = { low: 'petit budget', mid: 'budget modéré', high: 'budget confortable', lux: 'budget luxe' };
  var bLabel = budgetMap[state.budget] || '';
  if (price === 'gratuit' || price.indexOf('gratuit') > -1) {
    parts.push('gratuit, parfait pour un ' + (bLabel || 'budget maîtrisé'));
  } else if (state.budget === 'low' && (price.indexOf('€') > -1)) {
    parts.push('vérifiez les tarifs famille et réductions enfants');
  }

  // Solo adultes
  if (!hasKids && !hasBabies) {
    if (adults >= 2) {
      if (cat === 'gastronomie' || cat === 'nightlife' || cat.indexOf('nuit') > -1) {
        parts.push('idéal en groupe d\'adultes pour partager l\'expérience');
      } else if (cat === 'bien-être' || cat === 'wellness') {
        parts.push('moment de détente parfait pour un groupe d\'adultes');
      }
    }
    if (adults === 1) {
      parts.push('facilement accessible en solo');
    }
  }

  // Mois / saison
  var months = state.months;
  if (months.length > 0) {
    var summerMonths = [5,6,7,8]; // juin-sept
    var winterMonths = [11,0,1,2];
    var isSummer = months.some(function(m){ return summerMonths.indexOf(m) > -1; });
    var isWinter = months.some(function(m){ return winterMonths.indexOf(m) > -1; });
    if (isSummer && (cat === 'nature' || cat === 'plage' || name.indexOf('parc') > -1)) {
      parts.push('parfait en été pour profiter du plein air');
    }
    if (isWinter && (cat === 'musée' || cat === 'monument' || cat === 'gastronomie')) {
      parts.push('excellent choix en hiver pour se réchauffer en intérieur');
    }
  }

  if (parts.length === 0) {
    parts.push('activité recommandée pour votre type de groupe');
  }

  return '👥 ' + parts.slice(0, 2).join(' · ');
}

function refreshUnselected() {
  var d = state.results;
  var city = d.city;
  var pool = getActivities(city);

  // Indices sélectionnés → activités à garder
  var keptActivities = [];
  for (var ki = 0; ki < state.selectedActivities.length; ki++) {
    var idx = state.selectedActivities[ki];
    if (d.activities[idx]) keptActivities.push(d.activities[idx]);
  }

  // Tous les noms déjà vus (pas seulement la liste actuelle)
  if (!state.usedNames) state.usedNames = [];
  for (var ui = 0; ui < d.activities.length; ui++) {
    if (state.usedNames.indexOf(d.activities[ui].name) === -1) {
      state.usedNames.push(d.activities[ui].name);
    }
  }

  // Activités fraîches jamais montrées
  var fresh = [];
  for (var pi = 0; pi < pool.length; pi++) {
    if (state.usedNames.indexOf(pool[pi].name) === -1) {
      fresh.push(pool[pi]);
    }
  }

  var nbReplace = d.activities.length - keptActivities.length;

  if (fresh.length === 0) {
    alert('Toutes les activités disponibles ont déjà été affichées pour ' + city + ' !');
    return;
  }

  // Prendre les remplaçants nécessaires
  var taken = Math.min(nbReplace, fresh.length);
  var replacements = [];
  for (var ri = 0; ri < taken; ri++) {
    var a = fresh[ri];
    replacements.push({
      name: a.name, category: a.cat, description: a.desc,
      price: a.price, duration: a.dur, tags: [a.cat], tip: a.tip
    });
    state.usedNames.push(a.name);
  }

  // Construire la nouvelle liste : gardées d'abord, puis nouvelles
  var newActivities = [];
  for (var ni = 0; ni < keptActivities.length; ni++) {
    newActivities.push(Object.assign({}, keptActivities[ni], {rank: ni+1}));
  }
  for (var rj = 0; rj < replacements.length; rj++) {
    newActivities.push(Object.assign({}, replacements[rj], {rank: keptActivities.length + rj + 1}));
  }

  state.results.activities = newActivities;
  // Re-sélectionner les activités gardées (indices 0..keptActivities.length-1)
  state.selectedActivities = [];
  for (var si = 0; si < keptActivities.length; si++) {
    state.selectedActivities.push(si);
  }

  renderResults(document.getElementById('appRoot'));
}

function nextStep() { state.step = Math.min(state.step + 1, 9); render(); }
function prevStep() { state.step = Math.max(state.step - 1, 0); render(); }

function restartApp() {
  Object.assign(state, { step:0, city:'', adults:2, children:0, babies:0, childrenAges:[], months:[], activities:[], transport:[], maxHours:2, accommodation:[], budget:null, duration:null, results:null, selectedActivities:[], usedNames:[] });
  render();
}

function changeCity() {
  state.step = 0;
  render();
}

render();
</script>
